---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app tunarr
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 1h
  maxHistory: 3
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  dependsOn:
    - name: democratic-csi-local-hostpath
      namespace: storage
    - name: nfs-server
      namespace: storage
  values:
    controllers:
      tunarr:
        type: statefulset
        containers:
          app:
            image:
              repository: ghcr.io/chrisbenincasa/tunarr
              tag: 1.3.15@sha256:ae8ec490459e773571b277e2f64248605c1ea64d49ee4d26aa01741409d60369
            env:
              TZ: America/Chicago
              HOME: &home /home/tunarr
              MEILI_DUMP_DIR: /config/tunarr/dumps
              TUNARR_DATABASE_PATH: /config/tunarr
              TUNARR_LOG_LEVEL: info
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              claims:
                - name: gpu
              requests:
                cpu: 10m
              # limits:
              #   memory: 4G
    defaultPodOptions:
      nodeSelector:
        kubernetes.io/hostname: ${NODE}
      resourceClaims:
        - name: gpu
          resourceClaimName: *app
      securityContext:
        runAsNonRoot: true
        runAsUser: ${VOLSYNC_PUID}
        runAsGroup: ${VOLSYNC_PGID}
        fsGroup: ${VOLSYNC_PGID}
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: *app
        ports:
          http:
            port: &port 8000
    route:
      internal:
        enabled: true
        kind: HTTPRoute
        parentRefs:
          - name: envoy-internal
            namespace: networking
            sectionName: https
        hostnames:
          - "{{ .Release.Name }}.${INTERNAL_HOSTNAME}"
        rules:
          - backendRefs:
            - name: *app
              port: *port
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /config/tunarr
      data:
        enabled: true
        existingClaim: nfs-data
        advancedMounts:
          ersatztv:
            app:
              - path: /media
                subPath: media
                readOnly: true  
      # Tunarr writes HLS segments and logs underneath its data directory.
      streams:
        type: emptyDir
        sizeLimit: 8Gi
        globalMounts:
          - path: /config/tunarr/streams
      tmpfs:
        type: emptyDir
        advancedMounts:
          tunarr:
            app:
              - path: /config/tunarr/logs
                subPath: logs
              - path: *home
                subPath: home
              - path: /tmp
                subPath: tmp
              - path: /transcode
                subPath: transcode
      transcode:
        type: emptyDir
        sizeLimit: 8Gi
        globalMounts:
          - path: /transcode     
